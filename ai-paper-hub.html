<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 论文精读台</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<style>
:root{
  --bg:#141414; --panel:#1C1C1C; --card:#212121; --head:#191919;
  --line:#303030; --line2:#3B3B3B; --ink:#2E2E2E;
  --text:#F3F1ED; --sub:#9B9994; --mute:#6E6C66;
  --amber:#E9A33C; --amber2:#F3BC63; --amber-deep:#7E5A22;
  --amber-soft:rgba(233,163,60,.13);
  --red:#E4573D; --red-soft:rgba(228,87,61,.13);
  --green:#6FBF73; --green-soft:rgba(111,191,115,.13);
  --c1:#E9A33C; --c2:#C77DBE; --c3:#5FA8C7; --c4:#D9825A;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;padding-bottom:calc(28px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
svg{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:14px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
a{color:inherit}
::selection{background:rgba(233,163,60,.3)}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(20,20,20,.93);
  border-bottom:1px solid var(--line);padding:14px 0;
  backdrop-filter:saturate(150%) blur(10px);-webkit-backdrop-filter:saturate(150%) blur(10px)}
.brandbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;
  letter-spacing:2.2px;color:var(--text);white-space:nowrap}
.brand i{width:3px;height:14px;background:var(--amber);border-radius:2px;display:block}
.hspacer{flex:1}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--sub);background:var(--card);
  border:1px solid var(--line);padding:6px 12px;border-radius:999px;min-height:32px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}
.dot.loading{background:var(--amber)}
.dot.off{background:var(--red)}

/* ---------- 报头 ---------- */
.mast{padding:26px 0 6px}
.eyebrow{font-size:11px;color:var(--mute);letter-spacing:1.8px;margin-bottom:10px}
.mtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0;
  font-size:29px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.mtitle .slash{color:var(--line2);font-weight:400}
.pill{background:var(--amber);color:#181613;font-size:14.5px;font-weight:800;
  padding:4px 14px;border-radius:7px;letter-spacing:.2px;white-space:nowrap}
.kpirow{display:flex;flex-wrap:wrap;margin:20px 0 18px}
.kpi{padding:0 26px;position:relative}
.kpi:first-child{padding-left:0}
.kpi:not(:first-child)::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:1px;background:var(--line)}
.vrow{display:flex;align-items:baseline;gap:4px}
.kpi .v{font-size:27px;font-weight:800;line-height:1.15;letter-spacing:-.5px;color:var(--text)}
.vrow em{font-size:11.5px;font-style:normal;color:var(--mute);font-weight:600}
.kpi .k{font-size:11.5px;color:var(--mute);margin-top:3px;white-space:nowrap}
.lead{font-size:13px;color:var(--sub);line-height:1.85;margin:0;max-width:780px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hbtn{background:transparent;border:1px solid var(--line2);color:var(--sub);border-radius:9px;
  padding:0 13px;min-height:38px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;transition:.15s}
.hbtn:hover{border-color:var(--amber);color:var(--amber)}
.hbtn svg{width:15px;height:15px}

/* ---------- 区块 ---------- */
section{margin-top:30px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sechead svg{width:17px;height:17px;flex-shrink:0}
.sechead h2{margin:0;font-size:14.5px;font-weight:800;letter-spacing:.3px;
  display:flex;align-items:center;gap:8px;white-space:nowrap}
.sechead h2::before{content:'';width:3px;height:13px;background:var(--amber);border-radius:2px;display:block}
.sechead.icon h2::before{display:none}
.sechead .cnt{font-size:11.5px;color:var(--mute);white-space:nowrap}
.sechead .rule{flex:1;height:1px;background:var(--line)}

/* ---------- 今天要处理 ---------- */
.today{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:var(--radius);padding:16px 18px}
.titem{display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:9px;
  background:var(--red-soft);border:1px solid rgba(228,87,61,.3);margin-bottom:8px}
.titem.read{background:#242424;border-color:var(--line)}
.titem .tx{flex:1;min-width:0}
.tt{font-size:13.5px;font-weight:700;line-height:1.45;word-break:break-word}
.tm{font-size:11.5px;color:var(--mute);margin-top:3px}
.overdue{color:var(--red);font-weight:700;font-size:11.5px;margin-right:4px}
.tdone{min-height:36px;padding:0 13px;border-radius:8px;background:var(--amber);color:#181613;
  font-size:12.5px;font-weight:700;flex-shrink:0;display:inline-flex;align-items:center;transition:.15s}
.tdone:hover{background:var(--amber2)}
.tdone.ghost{background:transparent;color:var(--amber);border:1px solid var(--amber-deep);font-weight:600}
.tdone.ghost:hover{border-color:var(--amber);background:var(--amber-soft)}

/* ---------- 筛选 ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input[type=search]{flex:1;min-width:190px;min-height:42px;border:1px solid var(--line);
  border-radius:9px;padding:0 13px;background:var(--card);color:var(--text)}
.filters input[type=search]::placeholder{color:var(--mute)}
.filters select{min-height:42px;border:1px solid var(--line);border-radius:9px;padding:0 11px;
  background:var(--card);color:var(--sub);max-width:158px}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--amber);color:var(--text)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;
  font-size:12.5px;min-height:34px;display:inline-flex;align-items:center;color:var(--sub);transition:.15s}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber2);font-weight:700}

/* ---------- 日期分组 + 卡片网格 ---------- */
.dgroup{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;align-items:start;margin-top:22px}
.dhead{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.dhead .date{font-size:13px;font-weight:800;color:var(--amber);letter-spacing:.8px;white-space:nowrap}
.dhead .line{flex:1;height:1px;background:var(--line)}
.dhead .n{font-size:11.5px;color:var(--mute);white-space:nowrap}

/* ---------- 论文卡片 ---------- */
.paper{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .18s,box-shadow .18s}
.paper:hover{border-color:var(--amber-deep);box-shadow:0 6px 22px rgba(0,0,0,.35)}
.phead{position:relative;padding:17px 14px 12px;background:var(--head);
  border-bottom:1px solid var(--line);text-align:center;overflow:hidden}
.wm{font-size:20px;font-weight:800;letter-spacing:2.6px;color:var(--amber-deep);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.phead-sub{margin-top:5px;font-size:10.5px;color:var(--mute);letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corner{position:absolute;top:9px;right:9px;font-size:10.5px;font-weight:800;padding:3px 8px;
  border-radius:5px;background:var(--amber);color:#181613;letter-spacing:.3px}
.corner.skim{background:#393939;color:#C6C3BD}
.corner.arch{background:#2C2C2C;color:#8A8880}
.pbody{padding:14px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.bignum{display:flex;align-items:baseline;gap:6px}
.bignum b{font-size:19px;font-weight:800;color:var(--text);letter-spacing:.4px}
.bignum span{font-size:10.5px;color:var(--mute);letter-spacing:.6px}
a.pname{font-size:14.5px;font-weight:700;line-height:1.5;color:var(--text);
  text-decoration:none;word-break:break-word}
a.pname:hover{color:var(--amber)}
.pname-plain{font-size:14.5px;font-weight:700;line-height:1.5;word-break:break-word}
.pmeta{font-size:11.5px;color:var(--mute)}
.why{font-size:12.5px;color:#C0BDB6;line-height:1.65;border-left:2px solid var(--amber-deep);padding-left:10px}
.how{font-size:12px;color:var(--sub);line-height:1.7}
.how b{color:var(--amber2);font-weight:700}
.ptags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:10.5px;padding:2px 7px;border-radius:4px;font-weight:700;white-space:nowrap;
  background:var(--ink);color:var(--sub);border:1px solid var(--line2)}
.b-c1{background:var(--amber-soft);color:var(--amber2);border-color:rgba(233,163,60,.3)}
.b-c2{background:rgba(199,125,190,.14);color:#C77DBE;border-color:rgba(199,125,190,.3)}
.b-c3{background:rgba(95,168,199,.14);color:#5FA8C7;border-color:rgba(95,168,199,.3)}
.b-c4{background:rgba(217,130,90,.14);color:#D9825A;border-color:rgba(217,130,90,.3)}
.b-st{background:var(--ink);color:var(--sub);border-color:var(--line2)}
.b-st.doing{background:var(--amber-soft);color:var(--amber2);border-color:rgba(233,163,60,.3)}
.b-st.done{background:var(--green-soft);color:var(--green);border-color:rgba(111,191,115,.3)}
.pacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:5px}
.pacts .sp{flex:1}
.golink{font-size:12.5px;font-weight:800;color:var(--amber);text-decoration:none;
  letter-spacing:.2px;white-space:nowrap}
.golink:hover{color:var(--amber2)}
.pact{min-height:33px;border:1px solid var(--line2);background:transparent;border-radius:7px;
  padding:0 10px;font-size:12px;color:var(--sub);display:inline-flex;align-items:center;gap:4px;transition:.15s}
.pact:hover{border-color:var(--amber);color:var(--amber)}
.pact.primary{background:var(--amber);color:#181613;border-color:var(--amber);font-weight:800}
.pact.primary:hover{background:var(--amber2);color:#181613}
.pact svg{width:13px;height:13px}
.note{display:none}
.note.show{display:block}
.note textarea{width:100%;min-height:86px;border:1px solid var(--line2);border-radius:9px;
  padding:10px;font-size:16px;resize:vertical;background:#1A1A1A;color:var(--text)}
.note textarea::placeholder{color:var(--mute)}
.note .nb{display:flex;gap:8px;margin-top:8px}

/* ---------- 精读队列 ---------- */
.qrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #2A2A2A}
.qrow:last-child{border-bottom:none}
.qname{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:#D6D3CD}
.qbar{flex:0 0 96px;height:5px;border-radius:999px;background:var(--ink);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--amber);border-radius:999px}
.qpct{font-size:11.5px;color:var(--mute);width:34px;text-align:right;flex-shrink:0}

/* ---------- 统计 ---------- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.subt{font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:10px;letter-spacing:.4px}

/* ---------- 其他 ---------- */
.empty{text-align:center;color:var(--mute);font-size:13px;padding:30px 10px}
.empty svg{width:34px;height:34px;margin:0 auto 10px;opacity:.45}
.msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
  background:var(--amber);color:#181613;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:700;
  z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.msg.on{opacity:.97}
footer{text-align:center;color:var(--mute);font-size:11.5px;padding:34px 0 10px;line-height:2}
.fpill{display:inline-flex;align-items:center;background:var(--amber-soft);color:var(--amber2);
  border:1px solid rgba(233,163,60,.28);border-radius:6px;padding:2px 9px;font-size:11px;
  margin-right:7px;font-weight:700}

@media(max-width:900px){
  .dgroup{grid-template-columns:repeat(2,1fr)}
  .statgrid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .wrap{padding:0 14px}
  .mast{padding:20px 0 4px}
  .mtitle{font-size:23px;gap:9px}
  .pill{font-size:12.5px;padding:3px 11px}
  .kpirow{display:grid;grid-template-columns:1fr 1fr;gap:16px 0;margin:16px 0 14px}
  .kpi{padding:0 14px}
  .kpi:first-child,.kpi:nth-child(3){padding-left:0}
  .kpi:nth-child(3)::before{display:none}
  .kpi .v{font-size:21px}
  .vrow em{font-size:10.5px}
  .kpi .k{font-size:10.5px}
  .hbtn{min-height:44px}
  .hbtns .hbtn{flex:1;justify-content:center}
  .filters select{max-width:none;flex:1;min-width:110px}
  .filters input[type=search]{min-width:100%}
  .pact,.tdone{min-height:44px}
  .golink{padding:12px 0}
  .chip{min-height:38px;padding:8px 15px}
  .panel,.today{padding:14px}
  .titem{flex-wrap:wrap}
  .titem .tx{flex:1 0 100%}
}
@media(max-width:620px){
  .dgroup{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brandbar">
      <div class="brand"><i></i>AI.PAPERHUB</div>
      <div class="hspacer"></div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">加载中</span></div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="mast">
    <div class="eyebrow">论文精读门户</div>
    <h1 class="mtitle">
      <span id="mastCount" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7">0 篇论文</span>
      <span class="slash">/</span>
      <span id="mastScope" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7">全部</span>
      <span class="pill" id="mastPill" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7">全部</span>
    </h1>
    <div class="kpirow" id="kpis" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
    <p class="lead">这里收录我追踪的 AI 论文：题目、作者、原文链接、推荐理由与方法要点，按发表日期归档。每天 08:00 自动抓取更新，打开即可精读。</p>
    <div class="hbtns">
      <button class="hbtn" id="btnExport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        导出备份
      </button>
      <button class="hbtn" id="btnImport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg>
        导入恢复
      </button>
      <button class="hbtn" id="btnRefresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        刷新
      </button>
    </div>
  </div>

  <section id="secToday" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></section>

  <section>
    <div class="sechead">
      <h2>论文流</h2>
      <span class="cnt" id="streamCnt" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7">0 篇</span>
      <span class="rule"></span>
    </div>
    <div class="filters">
      <input type="search" id="kw" placeholder="搜索标题 / 作者 / 关键词">
      <select id="fDir"><option value="">全部方向</option></select>
      <select id="fLevel"><option value="">全部推荐</option></select>
      <select id="fState"><option value="">全部状态</option></select>
    </div>
    <div class="chips" id="quickChips"></div>
    <div id="stream" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
  </section>

  <section>
    <div class="panel">
      <div class="sechead">
        <h2>精读队列</h2>
        <span class="cnt" id="queueCnt" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7">0</span>
        <span class="rule"></span>
      </div>
      <div id="queue" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
    </div>
  </section>

  <section>
    <div class="panel">
      <div class="sechead">
        <h2>阅读分布</h2>
        <span class="rule"></span>
      </div>
      <div class="statgrid">
        <div>
          <div class="subt">方向分布</div>
          <div id="chartDir" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
        </div>
        <div>
          <div class="subt">近 7 天收录趋势</div>
          <div id="chartTrend" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div><span class="fpill">v1.2</span>AI 论文精读台 · 数据来源 arXiv 与 HuggingFace Daily Papers</div>
    <div>每日 08:00 自动抓取 · 题目 / 作者 / 原链接 / 推荐理由 / 方法要点</div>
  </footer>
</div>

<div class="msg" id="msg"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">

  var ICON_NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  var ICON_FIRE = '<svg viewBox="0 0 24 24" fill="none" stroke="#E9A33C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s5 5 5 9a5 5 0 0 1-10 0c0-1.5.8-2.8 1.7-3.8C9.5 8.6 12 6 12 2z"/><path d="M7 13a5 5 0 0 0 10 0"/></svg>';
  var ICON_INBOX = '<svg viewBox="0 0 24 24" fill="none" stroke="#6E6C66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.4 5.1L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1z"/></svg>';

  var db = (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) || null;
  var SCHEMA_OPTIONS = {};
  var state = {
    rows: [], offline: false, busy: false, errMsg: '',
    kw: '', dir: '', level: '', st: '', quick: 'all'
  };

  // ---------- 基础工具 ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;

  }
  // database 绑定标注：承载来自数据表的文本
  function bind(e) {
    e.setAttribute('data-sp-bindable', 'database');
    e.setAttribute('data-sp-database-id', DATABASE_ID);
    return e;
  }
  function dayStr(iso) { return iso ? String(iso).slice(0, 10) : ''; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function shiftDay(n) {
    var d = new Date(); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function daysBetween(a, b) {
    var x = new Date(a + 'T00:00:00Z'), y = new Date(b + 'T00:00:00Z');
    return Math.round((y - x) / 86400000);
  }
  function toast(t) {
    var m = $('msg'); m.textContent = t; m.className = 'msg on';
    clearTimeout(m._t); m._t = setTimeout(function () { m.className = 'msg'; }, 2000);
  }
  function setSync(mode, txt) {
    var d = $('syncDot'), t = $('syncTxt');
    d.className = 'dot' + (mode === 'loading' ? ' loading' : mode === 'off' ? ' off' : '');
    t.textContent = txt || (mode === 'off' ? '离线模式' : mode === 'loading' ? '同步中' : '已同步');
  }
  function safeUrl(u) {
    if (!u) return '';
    if (Object.prototype.toString.call(u) === '[object Array]') u = u[0];
    if (typeof u === 'object') u = u.link || u.text || '';
    return /^https?:\/\//i.test(String(u)) ? String(u) : '';
  }
  function val(row, k) { var v = row ? row[k] : null; return v == null ? '' : v; }
  function rid(r) { return (r && (r._id || r.record_id)) || ''; }

  function dirShort(d) {
    var m = {
      '大模型与Agent': 'LLM & AGENT', '多模态与生成': 'MULTIMODAL',
      'AI Infra与效率': 'AI INFRA', 'CV·RL·其他': 'CV · RL'
    };
    return m[d] || 'UNSORTED';
  }
  function levelShort(l) {
    if (l === '必读精读') return { big: '精读', unit: '必读' };
    if (l === '推荐泛读') return { big: '泛读', unit: '推荐' };
    if (l === '存档备查') return { big: '存档', unit: '备查' };
    return { big: '—', unit: '未分级' };
  }
  var SCOPE_LABEL = { all: '全部', overdue: '逾期必读', today: '今日新增', unread: '未读', doing: '在读', done: '已读' };

  // ---------- localStorage 兜底 ----------
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function readPatch() { return lsGet(LS_PATCH) || {}; }
  function applyPatch(rows) {
    var p = readPatch();
    if (!p || Object.keys(p).length === 0) return rows;
    return rows.map(function (r) {
      var o = p[rid(r)];
      if (!o) return r;
      var c = {}, k;
      for (k in r) { if (Object.prototype.hasOwnProperty.call(r, k)) c[k] = r[k]; }
      for (k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) c[k] = o[k]; }
      return c;
    });
  }
  function writePatch(id, obj) {
    var p = readPatch(); p[id] = p[id] || {};
    for (var k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) p[id][k] = obj[k]; }
    lsSet(LS_PATCH, p);
  }

  // ---------- 数据层 ----------
  function loadAll(startCursor, acc, guard) {
    acc = acc || []; guard = guard || 0;
    if (guard > 100) return Promise.resolve(acc);
    return db.query({
      databaseId: DATABASE_ID,
      sorts: [{ property: F.pub, direction: 'descending' }],
      pageSize: 200,
      startCursor: startCursor
    }).then(function (r) {
      acc = acc.concat(r.results || []);
      var next = r.nextCursor;
      if (r.hasMore && next && next !== startCursor && (r.results || []).length) {
        return loadAll(next, acc, guard + 1);
      }
      return acc;
    });
  }
  function loadData() {
    if (!db) { state.rows = applyPatch(lsGet(LS_SNAP) || []); refreshAll(); return; }
    if (state.busy) return;
    state.busy = true; setSync('loading');
    loadAll().then(function (rows) {
      state.busy = false;
      state.errMsg = '';
      state.rows = applyPatch(rows || []);
      state.offline = false;
      lsSet(LS_SNAP, rows || []);
      setSync('ok');
      refreshAll();
    }).catch(function (e) {
      state.busy = false;
      state.offline = true;
      state.errMsg = (e && (e.message || e.msg || e.error)) ? String(e.message || e.msg || e.error) : String(e || '未知错误');
      state.rows = applyPatch(lsGet(LS_SNAP) || []);
      setSync('off', '离线模式（本地快照）');
      refreshAll();
    });
  }
  function patchRecord(id, props) {
    if (!db) { writePatch(id, props); loadData(); return Promise.resolve(); }
    return db.updateRecord({ databaseId: DATABASE_ID, recordId: id, properties: props })
      .then(function () { loadData(); })
      .catch(function () { toast('保存失败，请重试'); });
  }

  // ---------- 计算层 ----------
  function isOverdue(r) {
    var pub = dayStr(val(r, F.pub));
    if (!pub) return false;
    return val(r, F.level) === '必读精读' && val(r, F.state) !== '已读' && daysBetween(pub, todayStr()) > 3;
  }
  function matchFilter(r) {
    var f = state;
    if (f.quick === 'overdue' && !isOverdue(r)) return false;
    if (f.quick === 'today' && dayStr(val(r, F.add)) !== todayStr()) return false;
    if (f.quick === 'unread' && val(r, F.state) !== '未读') return false;
    if (f.quick === 'doing' && val(r, F.state) !== '在读') return false;
    if (f.quick === 'done' && val(r, F.state) !== '已读') return false;
    if (f.dir && val(r, F.dir) !== f.dir) return false;
    if (f.level && val(r, F.level) !== f.level) return false;
    if (f.st && val(r, F.state) !== f.st) return false;
    if (f.kw) {
      var k = f.kw.toLowerCase();
      var hay = (val(r, F.title) + ' ' + val(r, F.author) + ' ' + val(r, F.why) + ' ' +
        val(r, F.how) + ' ' + val(r, F.dir) + ' ' + val(r, F.pid)).toLowerCase();
      if (hay.indexOf(k) === -1) return false;
    }
    return true;
  }
  function filteredRows() {
    return state.rows.filter(matchFilter);
  }
  function grouped(rows) {
    var map = {}, order = [];
    rows.forEach(function (r) {
      var d = dayStr(val(r, F.pub)) || '未知日期';
      if (!map[d]) { map[d] = []; order.push(d); }
      map[d].push(r);
    });
    return order.map(function (d) { return { date: d, items: map[d] }; });
  }
  function calcStats(rows) {
    var s = { total: rows.length, done: 0, unread: 0, doing: 0, must: 0, mustDone: 0, dirs: {}, trend: [] };
    rows.forEach(function (r) {
      var st = val(r, F.state);
      if (st === '已读') s.done++;
      else if (st === '在读') s.doing++;
      else s.unread++;
      if (val(r, F.level) === '必读精读') { s.must++; if (st === '已读') s.mustDone++; }
      var d = val(r, F.dir) || '未分类';
      s.dirs[d] = (s.dirs[d] || 0) + 1;
    });
    for (var i = 6; i >= 0; i--) {
      var day = shiftDay(-i);
      s.trend.push({ date: day, n: rows.filter(function (r) { return dayStr(val(r, F.add)) === day; }).length });
    }
    return s;
  }

  function loadFailMsg() {
    if (state.errMsg) return '数据加载失败：' + state.errMsg + '，请点击顶部「刷新」重试';
    if (!db) return '当前不在资料库页面环境中（数据接口未注入），请从资料库中的页面链接打开；本地浏览无法读取云端数据';
    return '数据表暂无记录，等待每日自动抓取';
  }
  function emptyBox(icon, text) {
    var em = mk('div', 'empty');
    em.innerHTML = icon + '<div>' + esc(text) + '</div>';
    return em;
  }

  // ---------- 渲染层（互不调用，统一由 refreshAll 调度） ----------
  function renderToday() {
    var box = $('secToday');
    box.innerHTML = '';
    var rows = state.rows;
    var overdue = rows.filter(isOverdue);
    var doing = rows.filter(function (r) { return val(r, F.state) === '在读' && !isOverdue(r); });
    var fresh = rows.filter(function (r) {
      return dayStr(val(r, F.add)) === todayStr() && val(r, F.state) === '未读' && val(r, F.level) === '必读精读';
    }).slice(0, 4);

    var card = mk('div', 'today');
    var sh = mk('div', 'sechead icon');
    sh.innerHTML = ICON_FIRE;
    var h = mk('h2', null, '今天要处理');
    var c = mk('span', 'cnt');
    c.textContent = (overdue.length + doing.length + fresh.length) + ' 条';
    bind(c);
    var rule = mk('span', 'rule');
    sh.appendChild(h); sh.appendChild(c); sh.appendChild(rule);
    card.appendChild(sh);

    if (!rows.length) {
      card.appendChild(emptyBox(ICON_INBOX, loadFailMsg()));
      box.appendChild(card); return;
    }

    overdue.forEach(function (r) { card.appendChild(todoItem(r, true)); });
    doing.forEach(function (r) { card.appendChild(todoItem(r, false)); });
    fresh.forEach(function (r) { card.appendChild(todoItem(r, false)); });

    if (!overdue.length && !doing.length && !fresh.length) {
      var ok = mk('div', 'empty');
      ok.innerHTML = ICON_CHECK + '<div>今天的必读都处理完了，去论文流挑几篇吧</div>';
      card.appendChild(ok);
    }
    box.appendChild(card);
  }

  function todoItem(r, overdue) {
    var wrap = mk('div', 'titem' + (overdue ? '' : ' read'));
    var tx = mk('div', 'tx');
    var t = mk('div', 'tt'); t.textContent = val(r, F.title); bind(t);
    var m = mk('div', 'tm');
    var age = daysBetween(dayStr(val(r, F.pub)) || todayStr(), todayStr());
    var stNow = val(r, F.state);
    var lead = overdue
      ? (stNow === '在读' ? '在读搁置 ' + age + ' 天 · ' : '逾期 ' + age + ' 天未读 · ')
      : (stNow === '在读' ? '在读中 · ' : '今日新增 · ');
    m.textContent = lead + val(r, F.dir) + ' · ' + val(r, F.author);
    bind(m);
    if (overdue) {
      var od = mk('span', 'overdue', '【必读】');
      m.insertBefore(od, m.firstChild);

    tx.appendChild(t); tx.appendChild(m);
    wrap.appendChild(tx);

    var url = safeUrl(r[F.url]);

      var a = document.createElement('a');

      a.textContent = '原文'; wrap.appendChild(a);

    b.onclick = function () {
      var p = {}; p[F.state] = { select: '已读' };

    };
    wrap.appendChild(b);
    return wrap;
  }

  function renderStream() {
    var box = $('stream');
    box.innerHTML = '';
    var rows = filteredRows();
    $('streamCnt').textContent = rows.length + ' 篇';
    bind($('streamCnt'));
    var groups = grouped(rows);
    if (!groups.length) {
      box.appendChild(emptyBox(ICON_INBOX, state.rows.length ? '没有符合条件的论文' : loadFailMsg()));
      return;
    }
    groups.forEach(function (g) {
      var d = mk('div', 'dgroup');
      var h = mk('div', 'dhead');
      var dt = mk('span', 'date'); dt.textContent = g.date; bind(dt);

      h.appendChild(dt); h.appendChild(ln); h.appendChild(n);
      d.appendChild(h);

      box.appendChild(d);

  function paperCard(r) {
    var c = mk('div', 'paper');
    var url = safeUrl(r[F.url]);
    var title = val(r, F.title) || '（无标题）';
    var d = val(r, F.dir);
    var lv = val(r, F.level);
    var st = val(r, F.state) || '未读';
    var pid = val(r, F.pid);

      bind(corner);
      head.appendChild(corner);
    }
    var wm = mk('div', 'wm', dirShort(d)); bind(wm); head.appendChild(wm);
    var hsub = mk('div', 'phead-sub', (pid ? 'arXiv:' + pid : '未标注 ID') + (pub ? '  ·  ' + pub : ''));
    bind(hsub); head.appendChild(hsub);
    c.appendChild(head);

    /* 主体 */
    var body = mk('div', 'pbody');
    var ls = levelShort(lv);
    var bn = mk('div', 'bignum');
    var bb = mk('b', null, ls.big); bind(bb);
    var bu = mk('span', null, ls.unit);

    body.appendChild(bn);

    if (url) {

    var meta = mk('div', 'pmeta');
    var au = mk('span', null, '作者：' + (val(r, F.author) || '—')); bind(au);
    meta.appendChild(au);
    body.appendChild(meta);

    var why = val(r, F.why);
    if (why) { var w = mk('div', 'why', why); bind(w); body.appendChild(w); }

    var how = val(r, F.how);

      hw.appendChild(hb); hw.appendChild(ht);
      body.appendChild(hw);
    }

    var tags = mk('div', 'ptags');
    if (d) { var t1 = mk('span', 'badge ' + (DIR_CLS[d] || 'b-st'), d); bind(t1); tags.appendChild(t1); }
    var t2 = mk('span', 'badge b-st' + (st === '在读' ? ' doing' : st === '已读' ? ' done' : ''), st);
    bind(t2); tags.appendChild(t2);
    if (isOverdue(r)) {
      var t3 = mk('span', 'overdue', (st === '在读' ? '搁置 ' : '逾期 ') +
        daysBetween(pub || todayStr(), todayStr()) + ' 天');
      tags.appendChild(t3);
    } else if (pub) {
      var dn = daysBetween(pub, todayStr());
      var t4 = mk('span', 'overdue', dn <= 0 ? '今日新收录' : '发表 ' + dn + ' 天');
      t4.style.color = 'var(--mute)';

    bm.onclick = function () {
      var p = {}; p[F.state] = { select: nextState };
      patchRecord(rid(r), p).then(function () { toast('状态已更新：' + nextState); });
    };
    acts.appendChild(bm);
    body.appendChild(acts);

    var nz = mk('div', 'note');
    var draftKey = 'wb_aipapers_draft_' + rid(r);
    var ta = document.createElement('textarea');
    var draft = null;
    try { draft = localStorage.getItem(draftKey); } catch (e) { draft = null; }
    ta.value = draft != null ? draft : val(r, F.note);
    ta.placeholder = '读后要点、可复现的结论、要跟进的引用…';
    if (draft != null && draft !== val(r, F.note)) {

      dk.style.color = 'var(--amber)';
      nz.appendChild(dk);
    }
    ta.addEventListener('input', function () {
      clearTimeout(ta._t);
      ta._t = setTimeout(function () {
        try { localStorage.setItem(draftKey, ta.value); } catch (e) { }
      }, 300);
    });
    nz.appendChild(ta);
    var nb = mk('div', 'nb');
    var sv = mk('button', 'pact primary', '保存笔记');
    sv.onclick = function () {
      var p = {}; p[F.note] = { text: ta.value };
      patchRecord(rid(r), p).then(function () {
        try { localStorage.removeItem(draftKey); } catch (e) { }
        toast('笔记已保存');
      });
    };
    var cx = mk('button', 'pact', '取消');
    cx.onclick = function () { nz.className = 'note'; };
    nb.appendChild(sv); nb.appendChild(cx);
    nz.appendChild(nb);
    body.appendChild(nz);

    c.appendChild(body);
    return c;
  }

  function toggleNote(card, r) {
    var n = card.querySelector('.note');

  }

  function renderQueue() {
    var box = $('queue'); box.innerHTML = '';
    var must = state.rows.filter(function (r) { return val(r, F.level) === '必读精读'; });
    $('queueCnt').textContent = must.filter(function (r) { return val(r, F.state) === '已读'; }).length + ' / ' + must.length;
    bind($('queueCnt'));
    if (!must.length) {
      var em = mk('div', 'empty'); em.innerHTML = ICON_INBOX + '<div>队列为空</div>';
      box.appendChild(em); return;
    }
    var order = { '在读': 0, '未读': 1, '已读': 2 };
    must.sort(function (a, b) {
      var oa = order[val(a, F.state)] == null ? 3 : order[val(a, F.state)];
      var ob = order[val(b, F.state)] == null ? 3 : order[val(b, F.state)];
      if (oa !== ob) return oa - ob;
      return daysBetween(dayStr(val(a, F.pub)) || todayStr(), dayStr(val(b, F.pub)) || todayStr());
    });
    must.slice(0, 12).forEach(function (r) {
      var st = val(r, F.state) || '未读';
      var pct = st === '已读' ? 100 : (st === '在读' ? 50 : 0);
      var row = mk('div', 'qrow');
      var nm = mk('div', 'qname', val(r, F.title)); bind(nm);
      nm.title = val(r, F.title);
      var bar = mk('div', 'qbar');
      var fill = document.createElement('i'); fill.style.width = pct + '%';
      if (st === '已读') fill.style.background = '#059669';
      else if (st === '在读') fill.style.background = '#F59E0B';
      bar.appendChild(fill);
      var pc = mk('div', 'qpct'); pc.textContent = st; bind(pc);
      var go = document.createElement('a');
      var u = safeUrl(r[F.url]);
      if (u) { go.href = u; go.target = '_blank'; go.rel = 'noopener'; go.className = 'pact'; go.innerHTML = ICON_LINK; }
      row.appendChild(nm); row.appendChild(bar); row.appendChild(pc);
      if (u) row.appendChild(go);
      box.appendChild(row);
    });
  }

  function renderStats() {
    var s = calcStats(state.rows);
    var rate = s.must ? Math.round(s.mustDone / s.must * 100) : 0;
    var kpis = [
      { k: '收录论文', v: s.total, u: '篇' },
      { k: '已读', v: s.done, u: '篇' },
      { k: '待读 / 在读', v: s.unread + ' / ' + s.doing, u: '篇' },
      { k: '精读完成率', v: rate, u: '%' }
    ];
    var box = $('kpis'); box.innerHTML = '';
    kpis.forEach(function (x) {
      var d = mk('div', 'kpi');
      var vr = mk('div', 'vrow');
      var v = mk('div', 'v'); v.textContent = String(x.v); bind(v);
      var u = mk('em', null, x.u);
      vr.appendChild(v); vr.appendChild(u);
      var k = mk('div', 'k', x.k);
      d.appendChild(vr); d.appendChild(k); box.appendChild(d);
    });
    $('chartDir').innerHTML = dirChart(s.dirs, s.total);
    $('chartTrend').innerHTML = trendChart(s.trend);
    var old = document.getElementById('backupTip');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    if (s.total >= 30) {
      var tip = mk('div', 'tm');
      tip.id = 'backupTip';
      tip.style.cssText = 'margin-top:14px;color:var(--amber2);background:var(--amber-soft);' +
        'border:1px solid rgba(233,163,60,.28);border-radius:9px;padding:9px 12px;font-size:12.5px';
      tip.textContent = '数据已积累 ' + s.total + ' 条，建议点击「导出备份」保存一份快照';
      bind(tip);
      $('kpis').parentNode.appendChild(tip);
    }
  }

  function dirChart(dirs, total) {
    var keys = DIR_ORDER.slice();
    Object.keys(dirs).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); });
    var max = 1;
    keys.forEach(function (k) { if ((dirs[k] || 0) > max) max = dirs[k]; });
    var rowH = 32, labelW = 100, barArea = 148, w = 300, h = Math.max(keys.length, 1) * rowH + 6;
    var g = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" style="max-width:340px" role="img">';
    keys.forEach(function (k, i) {
      var n = dirs[k] || 0;
      var bw = Math.max(2, Math.round(n / max * barArea));
      var y = i * rowH + 6;
      g += '<text x="0" y="' + (y + 13) + '" font-size="10.5" fill="#9B9994">' + esc(k) + '</text>';
      g += '<rect x="' + labelW + '" y="' + (y + 3) + '" width="' + barArea + '" height="11" rx="5.5" fill="#2E2E2E"/>';
      g += '<rect x="' + labelW + '" y="' + (y + 3) + '" width="' + bw + '" height="11" rx="5.5" fill="' +
        (DIR_COLOR[k] || '#6E6C66') + '"/>';
      g += '<text x="' + (labelW + barArea + 8) + '" y="' + (y + 13) + '" font-size="10.5" fill="#D6D3CD">' + n + '</text>';
    });
    g += '</svg>';
    return g;
  }

  function trendChart(trend) {
    var max = 1;
    trend.forEach(function (t) { if (t.n > max) max = t.n; });
    var w = 300, h = 136, pad = 24, bw = 24;
    var g = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" style="max-width:340px" role="img">';
    g += '<line x1="0" y1="' + (h - pad) + '" x2="' + w + '" y2="' + (h - pad) + '" stroke="#303030" stroke-width="1"/>';
    trend.forEach(function (t, i) {
      var bh = t.n ? Math.max(5, Math.round(t.n / max * 80)) : 0;
      var x = 8 + i * ((w - 20) / trend.length);
      var y = h - pad - bh;
      var last = i === trend.length - 1;
      if (bh > 0) {
        g += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="3" fill="' +
          (last ? '#E9A33C' : '#7E5A22') + '"/>';
      }
      if (t.n) {
        g += '<text x="' + (x + bw / 2) + '" y="' + (y - 5) + '" font-size="10" fill="#D6D3CD" text-anchor="middle">' +
          t.n + '</text>';
      }
      g += '<text x="' + (x + bw / 2) + '" y="' + (h - 8) + '" font-size="10" fill="#6E6C66" text-anchor="middle">' +
        esc(t.date.slice(5)) + '</text>';
    });
    g += '</svg>';
    return g;
  }

  function renderChips() {
    var box = $('quickChips');
    var defs = [
      { k: 'all', t: '全部' }, { k: 'overdue', t: '逾期必读' }, { k: 'today', t: '今日新增' },
      { k: 'unread', t: '未读' }, { k: 'doing', t: '在读' }, { k: 'done', t: '已读' }
    ];
    if (box.childNodes.length) {
      Array.prototype.forEach.call(box.childNodes, function (n) {
        n.className = 'chip' + (n.getAttribute('data-k') === state.quick ? ' on' : '');
      });
      var od = box.querySelector('[data-k="overdue"]');
      if (od) { var n = state.rows.filter(isOverdue).length; od.textContent = n ? '逾期必读 ' + n : '逾期必读'; }
      return;
    }
    box.innerHTML = '';
    defs.forEach(function (d) {
      var b = mk('button', 'chip' + (state.quick === d.k ? ' on' : ''), d.t);
      b.setAttribute('data-k', d.k);
      b.onclick = function () { state.quick = d.k; renderChips(); applyFilters(); };
      box.appendChild(b);
    });
  }

  function fillSelect(sel, options, placeholder) {
    var cur = sel.value;
    sel.innerHTML = '';
    var o0 = mk('option', null, placeholder); o0.value = ''; sel.appendChild(o0);
    (options || []).forEach(function (op) {
      var o = mk('option', null, op.text || op); o.value = op.text || op; sel.appendChild(o);
    });
    sel.value = cur;
  }

  function renderFilterOptions() {
    fillSelect($('fDir'), SCHEMA_OPTIONS[F.dir] || DIR_ORDER, '全部方向');
    fillSelect($('fLevel'), SCHEMA_OPTIONS[F.level] || LEVELS, '全部推荐');
    fillSelect($('fState'), SCHEMA_OPTIONS[F.state] || STATES, '全部状态');
  }

  // ---------- 统一刷新入口 ----------
  function renderMast() {
    var n = filteredRows().length;
    var mc = $('mastCount');
    mc.textContent = n + ' 篇论文'; bind(mc);
    var label = SCOPE_LABEL[state.quick] || '全部';
    var ms = $('mastScope'); ms.textContent = label; bind(ms);
    var mp = $('mastPill'); mp.textContent = label; bind(mp);
  }

  function applyFilters() {
    renderMast();
    renderStream();
  }

  function refreshAll() {
    renderMast();
    renderToday();
    renderChips();
    renderStream();
    renderQueue();
    renderStats();
  }

  // ---------- 导入导出 ----------
  function doExport() {
    var data = { exportedAt: new Date().toISOString(), source: 'AI 论文精读台', papers: state.rows };
    var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ai-papers-' + todayStr() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('已导出 ' + state.rows.length + ' 条');
  }
  function doImport(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var data;
      try { data = JSON.parse(String(fr.result)); } catch (e) { toast('文件不是合法 JSON'); return; }
      var list = Array.isArray(data) ? data : (data.papers || []);
      if (!list.length) { toast('没有可导入的记录'); return; }
      if (!db) { toast('离线模式无法导入'); return; }
      var todo = list.map(function (r) {
        var p = {}, k;
        for (k in r) {
          if (Object.prototype.hasOwnProperty.call(r, k) && k !== '_id') {
            if (k === F.url) { p[k] = { url: { text: (r[k] && r[k].text) || '原文', link: (r[k] && r[k].link) || '' } }; }
            else if (k === F.pub || k === F.add) { p[k] = { date: dayStr(r[k]) || todayStr() }; }
            else if (k === F.dir || k === F.level || k === F.state) { p[k] = { select: r[k] }; }
            else { p[k] = { text: String(r[k] == null ? '' : r[k]) }; }
          }
        }
        return p;
      });
      var i = 0, ok = 0;
      function step() {
        if (i >= todo.length) { toast('导入完成，成功 ' + ok + ' 条'); loadData(); return; }
        var batch = todo.slice(i, i + 100); i += 100;
        // SDK 为单条写入接口，这里串行逐条提交
        var chain = Promise.resolve();
        batch.forEach(function (p) {
          chain = chain.then(function () {
            return db.addRecord({ databaseId: DATABASE_ID, properties: p })
              .then(function () { ok++; }).catch(function () { });
          });
        });
        chain.then(step);
      }
      step();
    };
    fr.readAsText(file);
  }

  // ---------- 事件绑定 ----------
  function bindEvents() {
    $('kw').addEventListener('input', function () { state.kw = this.value; applyFilters(); });
    $('fDir').addEventListener('change', function () { state.dir = this.value; applyFilters(); });
    $('fLevel').addEventListener('change', function () { state.level = this.value; applyFilters(); });
    $('fState').addEventListener('change', function () { state.st = this.value; applyFilters(); });
    $('btnRefresh').addEventListener('click', function () { state.busy = false; loadData(); });
    $('btnExport').addEventListener('click', doExport);
    $('btnImport').addEventListener('click', function () { $('fileIn').click(); });
    $('fileIn').addEventListener('change', function () {
      if (this.files && this.files[0]) doImport(this.files[0]);
      this.value = '';
    });
  }

  // ---------- 初始化 ----------
  function subscribeUpdates() {
    if (!db || typeof db.onUpdated !== 'function') return;
    var timer = null;
    db.onUpdated(function (payload) {
      var ids = (payload && payload.databaseIds) || [];
      if (ids.indexOf(DATABASE_ID) === -1) return;
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { timer = null; loadData(); }, 400);
    });
  }

  function init() {
    bindEvents();
    renderFilterOptions();
    renderChips();
    if (!db) {
      state.offline = true;
      setSync('off', '离线模式（本地快照）');
      state.rows = applyPatch(lsGet(LS_SNAP) || []);
      refreshAll();
      return;
    }
    db.getSchema({ databaseId: DATABASE_ID }).then(function (schema) {
      (schema.properties || []).forEach(function (f) {
        if ((f.type === 'select' || f.type === 'multi_select') && f.config && f.config.options) {
          SCHEMA_OPTIONS[f.name] = f.config.options;
        }
      });
      renderFilterOptions();
    }).catch(function () { renderFilterOptions(); });
    subscribeUpdates();
    loadData();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
</body>
</html>
