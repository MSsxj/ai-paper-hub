<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 论文精读台</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<style>
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --line:#E8EAF0; --text:#1B1F29; --sub:#6B7280; --mute:#9AA1AE;
  --brand:#4F46E5; --brand-soft:#EEF0FF;
  --red:#DC2626; --red-soft:#FEF2F2; --amber:#F59E0B; --green:#059669; --green-soft:#ECFDF5;
  --c1:#4F46E5; --c2:#DB2777; --c3:#0891B2; --c4:#EA580C;
  --radius:14px; --shadow:0 1px 2px rgba(20,25,45,.05),0 6px 18px rgba(20,25,45,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;padding-bottom:calc(28px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
svg{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:14px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
a{color:inherit}

/* header */
header{background:linear-gradient(135deg,#4F46E5 0%,#6D5DF6 55%,#8B7CF8 100%);color:#fff;padding:20px 0 22px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:.3px}
.brand svg{width:24px;height:24px}
.htag{font-size:12px;opacity:.85;margin-top:2px}
.hspacer{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.16);
  padding:6px 12px;border-radius:999px;min-height:32px}
.dot{width:7px;height:7px;border-radius:50%;background:#34D399;display:inline-block}
.dot.loading{background:#FCD34D}.dot.off{background:#FCA5A5}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:0 14px;min-height:44px;
  display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.hbtn:hover{background:rgba(255,255,255,.26)}
.hbtn svg{width:16px;height:16px}

/* sections */
section{margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sh h2{margin:0;font-size:16px;font-weight:700}
.sh svg{width:18px;height:18px}
.sh .cnt{font-size:12px;color:var(--sub);background:#F1F2F7;border-radius:999px;padding:2px 9px}

/* today */
.today{border:1px solid #FBD5D5;background:linear-gradient(180deg,#FFF7F7 0%,#FFFFFF 60%)}
.titem{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:11px;background:var(--red-soft);
  border:1px solid #FADCDC;margin-bottom:8px}
.titem.read{background:#F3F4F8;border-color:var(--line)}
.titem .tx{flex:1;min-width:0}
.tt{font-size:14px;font-weight:600;line-height:1.45;word-break:break-word}
.tm{font-size:12px;color:var(--sub);margin-top:3px}
.tdone{min-height:44px;padding:0 14px;border-radius:10px;background:var(--brand);color:#fff;font-size:13px;font-weight:600;flex-shrink:0}
.tdone.ghost{background:#fff;color:var(--brand);border:1px solid #C7CCFF}
.overdue{color:var(--red);font-weight:700;font-size:12px}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input[type=search]{flex:1;min-width:180px;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
.filters select{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;max-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;min-height:34px;
  display:inline-flex;align-items:center;color:var(--sub)}
.chip.on{background:var(--brand-soft);border-color:#C7CCFF;color:var(--brand);font-weight:600}

/* date group */
.dgroup{margin-top:16px}
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dhead .date{font-size:13px;font-weight:700;color:var(--sub);background:#F1F2F7;border-radius:8px;padding:3px 10px}
.dhead .line{flex:1;height:1px;background:var(--line)}
.dhead .n{font-size:12px;color:var(--mute)}

.paper{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;margin-bottom:10px}
.paper:hover{border-color:#D6DAE6}
.ptop{display:flex;gap:10px;align-items:flex-start}
.ptitle{flex:1;min-width:0}
.ptitle a{font-size:15px;font-weight:650;line-height:1.45;text-decoration:none;word-break:break-word}
.ptitle a:hover{color:var(--brand);text-decoration:underline}
.pmeta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.b-c1{background:#EEF0FF;color:var(--c1)} .b-c2{background:#FCE7F3;color:var(--c2)}
.b-c3{background:#E0F6FA;color:var(--c3)} .b-c4{background:#FFF1E7;color:var(--c4)}
.b-must{background:var(--red-soft);color:var(--red)} .b-skim{background:#FFFBEB;color:#B45309}
.b-arch{background:#F3F4F6;color:#4B5563}
.b-st{background:#F1F2F7;color:var(--sub)}
.b-st.doing{background:#FFFBEB;color:#B45309} .b-st.done{background:var(--green-soft);color:var(--green)}
.why{font-size:13px;color:#374151;background:#FAFAFC;border-left:3px solid var(--brand);border-radius:0 8px 8px 0;
  padding:8px 11px;margin-top:9px}
.how{font-size:12.5px;color:var(--sub);margin-top:7px;display:none}
.how.show{display:block}
.pacts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pact{min-height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 12px;font-size:13px;color:var(--sub);
  display:inline-flex;align-items:center;gap:5px}
.pact:hover{border-color:var(--brand);color:var(--brand)}
.pact.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.pact.primary:hover{background:#4338CA;color:#fff}
.pact svg{width:14px;height:14px}
.note{margin-top:9px;display:none}
.note.show{display:block}
.note textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;resize:vertical;background:#FCFCFE}
.note .nb{display:flex;gap:8px;margin-top:8px}

/* queue */
.qrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.qrow:last-child{border-bottom:none}
.qbar{flex:1;height:6px;border-radius:999px;background:#EEF0F6;overflow:hidden;min-width:60px}
.qbar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.qname{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpct{font-size:12px;color:var(--sub);width:44px;text-align:right;flex-shrink:0}

/* stats */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:#FAFBFF;border:1px solid var(--line);border-radius:11px;padding:12px}
.kpi .v{font-size:22px;font-weight:750;line-height:1.2}
.kpi .k{font-size:12px;color:var(--sub);margin-top:2px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.subt{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:8px}

.empty{text-align:center;color:var(--mute);font-size:14px;padding:26px 10px}
.empty svg{width:40px;height:40px;margin:0 auto 8px;opacity:.5}
.msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
  background:#1B1F29;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;z-index:99;opacity:0;
  pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.msg.on{opacity:.96}
footer{text-align:center;color:var(--mute);font-size:12px;padding:22px 0 6px}

@media(max-width:768px){
  .wrap{padding:0 12px}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .statgrid{grid-template-columns:1fr}
  .filters select{max-width:none;flex:1;min-width:120px}
  .filters input[type=search]{min-width:100%}
  .brand{font-size:17px}
  .hbtn{flex:1;justify-content:center;min-width:calc(50% - 4px)}
  .tdone{padding:0 12px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <div>
        <div class="brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H18a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 19.5z"/>
            <path d="M8 7h8M8 11h8M8 15h5"/>
          </svg>
          AI 论文精读台
        </div>
        <div class="htag">每日自动更新 · 按发表日期归档 · 精读优先</div>
      </div>
      <div class="hspacer"></div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">加载中</span></div>

      <button class="hbtn" id="btnExport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>

      </button>
      <button class="hbtn" id="btnImport">

        导入恢复
      </button>
      <button class="hbtn" id="btnRefresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        刷新
      </button>
    </div>
  </div>
</header>

<div class="wrap">

  <section id="secToday" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></section>

  <section>
    <div class="card">
      <div class="sh">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <h2>论文流</h2><span class="cnt" id="streamCnt" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7">0 篇</span>
      </div>
      <div class="filters">
        <input type="search" id="kw" placeholder="搜索标题 / 作者 / 关键词">
        <select id="fDir"><option value="">全部方向</option></select>
        <select id="fLevel"><option value="">全部推荐</option></select>
        <select id="fState"><option value="">全部状态</option></select>
      </div>
      <div class="chips" id="quickChips"></div>
      <div id="stream" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
    </div>
  </section>

  <section>
    <div class="card">
      <div class="sh">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 6.9H22l-5.6 4.1 2.1 6.9L12 15.8 5.5 19.9l2.1-6.9L2 8.9h7.6z"/></svg>
        <h2>精读队列</h2><span class="cnt" id="queueCnt" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7">0</span>
      </div>
      <div id="queue" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
    </div>
  </section>

  <section>
    <div class="card">
      <div class="sh">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        <h2>阅读统计</h2>
      </div>
      <div class="grid4" id="kpis" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
      <div class="statgrid">
        <div>
          <div class="subt">方向分布</div>
          <div id="chartDir" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
        </div>
        <div>
          <div class="subt">近 7 天收录趋势</div>
          <div id="chartTrend" data-sp-bindable="database" data-sp-database-id="MzEtMnIAGz0fWAztXpLJq7"></div>
        </div>
      </div>
    </div>
  </section>

  <footer>数据来源：arXiv · HuggingFace Daily Papers　|　每日 08:00 自动抓取更新</footer>
</div>

<div class="msg" id="msg"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">

<script>
(function () {
  'use strict';

  var DATABASE_ID = 'MzEtMnIAGz0fWAztXpLJq7';
  var LS_SNAP = 'wb_aipapers_snapshot';
  var LS_PATCH = 'wb_aipapers_patch';

  var F = {
    title: '标题', author: '作者', url: '原文链接', dir: '分类方向',
    level: '推荐等级', why: '推荐理由', how: '方法要点', state: '阅读状态',
    note: '我的笔记', pub: '发表日期', add: '收录日期', pid: '论文ID'
  };
  var DIR_ORDER = ['大模型与Agent', '多模态与生成', 'AI Infra与效率', 'CV·RL·其他'];
  var DIR_CLS = { '大模型与Agent': 'b-c1', '多模态与生成': 'b-c2', 'AI Infra与效率': 'b-c3', 'CV·RL·其他': 'b-c4' };
  var DIR_COLOR = { '大模型与Agent': '#4F46E5', '多模态与生成': '#DB2777', 'AI Infra与效率': '#0891B2', 'CV·RL·其他': '#EA580C' };
  var LEVEL_CLS = { '必读精读': 'b-must', '推荐泛读': 'b-skim', '存档备查': 'b-arch' };
  var LEVELS = ['必读精读', '推荐泛读', '存档备查'];
  var STATES = ['未读', '在读', '已读'];
  var ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var ICON_NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  var ICON_FIRE = '<svg viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s5 5 5 9a5 5 0 0 1-10 0c0-1.5.8-2.8 1.7-3.8C9.5 8.6 12 6 12 2z"/><path d="M7 13a5 5 0 0 0 10 0"/></svg>';
  var ICON_INBOX = '<svg viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.4 5.1L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1z"/></svg>';

  var db = (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) || null;
  var SCHEMA_OPTIONS = {};
  var state = {
    rows: [], offline: false, busy: false, errMsg: '',
    kw: '', dir: '', level: '', st: '', quick: 'all'
  };

  // ---------- 基础工具 ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // database 绑定标注：承载来自数据表的文本
  function bind(e) {
    e.setAttribute('data-sp-bindable', 'database');
    e.setAttribute('data-sp-database-id', DATABASE_ID);
    return e;
  }
  function dayStr(iso) { return iso ? String(iso).slice(0, 10) : ''; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function shiftDay(n) {
    var d = new Date(); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function daysBetween(a, b) {
    var x = new Date(a + 'T00:00:00Z'), y = new Date(b + 'T00:00:00Z');
    return Math.round((y - x) / 86400000);
  }
  function toast(t) {
    var m = $('msg'); m.textContent = t; m.className = 'msg on';
    clearTimeout(m._t); m._t = setTimeout(function () { m.className = 'msg'; }, 2000);
  }
  function setSync(mode, txt) {
    var d = $('syncDot'), t = $('syncTxt');
    d.className = 'dot' + (mode === 'loading' ? ' loading' : mode === 'off' ? ' off' : '');
    t.textContent = txt || (mode === 'off' ? '离线模式' : mode === 'loading' ? '同步中' : '已同步');
  }
  function safeUrl(u) {
    if (!u) return '';
    if (Object.prototype.toString.call(u) === '[object Array]') u = u[0];
    if (typeof u === 'object') u = u.link || u.text || '';
    return /^https?:\/\//i.test(String(u)) ? String(u) : '';
  }
  function val(row, k) { var v = row ? row[k] : null; return v == null ? '' : v; }
  function rid(r) { return (r && (r._id || r.record_id)) || ''; }

  // ---------- localStorage 兜底 ----------
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function readPatch() { return lsGet(LS_PATCH) || {}; }
  function applyPatch(rows) {
    var p = readPatch();
    if (!p || Object.keys(p).length === 0) return rows;
    return rows.map(function (r) {
      var o = p[rid(r)];
      if (!o) return r;
      var c = {}, k;
      for (k in r) { if (Object.prototype.hasOwnProperty.call(r, k)) c[k] = r[k]; }
      for (k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) c[k] = o[k]; }
      return c;
    });
  }
  function writePatch(id, obj) {
    var p = readPatch(); p[id] = p[id] || {};
    for (var k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) p[id][k] = obj[k]; }
    lsSet(LS_PATCH, p);
  }

  // ---------- 数据层 ----------
  function loadAll(startCursor, acc, guard) {
    acc = acc || []; guard = guard || 0;
    if (guard > 100) return Promise.resolve(acc);
    return db.query({
      databaseId: DATABASE_ID,
      sorts: [{ property: F.pub, direction: 'descending' }],
      pageSize: 200,
      startCursor: startCursor
    }).then(function (r) {
      acc = acc.concat(r.results || []);
      var next = r.nextCursor;
      if (r.hasMore && next && next !== startCursor && (r.results || []).length) {
        return loadAll(next, acc, guard + 1);
      }
      return acc;
    });
  }
  function loadData() {
    if (!db) { state.rows = applyPatch(lsGet(LS_SNAP) || []); refreshAll(); return; }
    if (state.busy) return;
    state.busy = true; setSync('loading');
    loadAll().then(function (rows) {
      state.busy = false;
      state.errMsg = '';
      state.rows = applyPatch(rows || []);
      state.offline = false;
      lsSet(LS_SNAP, rows || []);
      setSync('ok');
      refreshAll();
    })['catch'](function (e) {
      state.busy = false;
      state.offline = true;
      state.errMsg = (e && (e.message || e.msg || e.error)) ? String(e.message || e.msg || e.error) : String(e || '未知错误');
      state.rows = applyPatch(lsGet(LS_SNAP) || []);
      setSync('off', '离线模式（本地快照）');
      refreshAll();
    });
  }
  function patchRecord(id, props) {
    if (!db) { writePatch(id, props); loadData(); return Promise.resolve(); }
    return db.updateRecord({ databaseId: DATABASE_ID, recordId: id, properties: props })
      .then(function () { loadData(); })
      ['catch'](function () { toast('保存失败，请重试'); });
  }

  // ---------- 计算层 ----------
  function isOverdue(r) {
    var pub = dayStr(val(r, F.pub));
    if (!pub) return false;
    return val(r, F.level) === '必读精读' && val(r, F.state) !== '已读' && daysBetween(pub, todayStr()) > 3;
  }
  function matchFilter(r) {
    var f = state;
    if (f.quick === 'overdue' && !isOverdue(r)) return false;
    if (f.quick === 'today' && dayStr(val(r, F.add)) !== todayStr()) return false;
    if (f.quick === 'unread' && val(r, F.state) !== '未读') return false;
    if (f.quick === 'doing' && val(r, F.state) !== '在读') return false;
    if (f.quick === 'done' && val(r, F.state) !== '已读') return false;
    if (f.dir && val(r, F.dir) !== f.dir) return false;
    if (f.level && val(r, F.level) !== f.level) return false;
    if (f.st && val(r, F.state) !== f.st) return false;
    if (f.kw) {
      var k = f.kw.toLowerCase();
      var hay = (val(r, F.title) + ' ' + val(r, F.author) + ' ' + val(r, F.why) + ' ' +
        val(r, F.how) + ' ' + val(r, F.dir) + ' ' + val(r, F.pid)).toLowerCase();
      if (hay.indexOf(k) === -1) return false;
    }
    return true;
  }
  function filteredRows() {
    return state.rows.filter(matchFilter);
  }
  function grouped(rows) {
    var map = {}, order = [];
    rows.forEach(function (r) {
      var d = dayStr(val(r, F.pub)) || '未知日期';
      if (!map[d]) { map[d] = []; order.push(d); }
      map[d].push(r);
    });
    return order.map(function (d) { return { date: d, items: map[d] }; });
  }
  function calcStats(rows) {
    var s = { total: rows.length, done: 0, unread: 0, doing: 0, must: 0, mustDone: 0, dirs: {}, trend: [] };
    rows.forEach(function (r) {
      var st = val(r, F.state);
      if (st === '已读') s.done++;
      else if (st === '在读') s.doing++;
      else s.unread++;
      if (val(r, F.level) === '必读精读') { s.must++; if (st === '已读') s.mustDone++; }
      var d = val(r, F.dir) || '未分类';
      s.dirs[d] = (s.dirs[d] || 0) + 1;
    });
    for (var i = 6; i >= 0; i--) {
      var day = shiftDay(-i);
      s.trend.push({ date: day, n: rows.filter(function (r) { return dayStr(val(r, F.add)) === day; }).length });
    }
    return s;
  }

  function dirChart(dirs, total) {
    var keys = DIR_ORDER.slice();
    Object.keys(dirs).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); });
    var max = 1;
    keys.forEach(function (k) { if ((dirs[k] || 0) > max) max = dirs[k]; });
    var rowH = 30, labelW = 104, barArea = 150, w = 300, h = Math.max(keys.length, 1) * rowH + 6;
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" style="max-width:340px" role="img">';
    keys.forEach(function (k, i) {
      var n = dirs[k] || 0;
      var bw = Math.max(2, Math.round(n / max * barArea));
      var y = i * rowH + 6;
      s += '<text x="0" y="' + (y + 13) + '" font-size="11" fill="#6B7280">' + esc(k.length > 8 ? k.slice(0, 8) : k) + '</text>';
      s += '<rect x="' + labelW + '" y="' + (y + 3) + '" width="' + barArea + '" height="12" rx="6" fill="#EEF0F6"/>';
      s += '<rect x="' + labelW + '" y="' + (y + 3) + '" width="' + bw + '" height="12" rx="6" fill="' + (DIR_COLOR[k] || '#9AA1AE') + '"/>';
      s += '<text x="' + (labelW + barArea + 8) + '" y="' + (y + 13) + '" font-size="11" fill="#374151">' + n + '</text>';
    });
    s += '</svg>';
    return s;
  }

  function trendChart(trend) {
    var max = 1;
    trend.forEach(function (t) { if (t.n > max) max = t.n; });
    var w = 300, h = 132, pad = 22, bw = 26;
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" style="max-width:340px" role="img">';
    s += '<line x1="0" y1="' + (h - pad) + '" x2="' + w + '" y2="' + (h - pad) + '" stroke="#E8EAF0" stroke-width="1"/>';
    trend.forEach(function (t, i) {
      var bh = Math.max(3, Math.round(t.n / max * 78));
      var x = 8 + i * ((w - 20) / trend.length);
      var y = h - pad - bh;
      s += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="4" fill="#4F46E5" opacity="' + (i === trend.length - 1 ? '1' : '0.72') + '"/>';
      if (t.n) s += '<text x="' + (x + bw / 2) + '" y="' + (y - 4) + '" font-size="10" fill="#6B7280" text-anchor="middle">' + t.n + '</text>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (h - 7) + '" font-size="10" fill="#9AA1AE" text-anchor="middle">' + esc(t.date.slice(5)) + '</text>';
    });
    s += '</svg>';
    return s;
  }

  function doExport() {

    var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });

  function doImport(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var data;
      try { data = JSON.parse(String(fr.result)); } catch (e) { toast('文件不是合法 JSON'); return; }
      var list = Array.isArray(data) ? data : (data.papers || []);
      if (!list.length) { toast('没有可导入的记录'); return; }
      if (!db) { toast('离线模式无法导入'); return; }
      var todo = list.map(function (r) {
        var p = {}, k;
        for (k in r) {
          if (Object.prototype.hasOwnProperty.call(r, k) && k !== '_id') {
            if (k === F.url) { p[k] = { url: { text: (r[k] && r[k].text) || '原文', link: (r[k] && r[k].link) || '' } }; }
            else if (k === F.pub || k === F.add) { p[k] = { date: dayStr(r[k]) || todayStr() }; }
            else if (k === F.dir || k === F.level || k === F.state) { p[k] = { select: r[k] }; }
            else { p[k] = { text: String(r[k] == null ? '' : r[k]) }; }
          }
        }
        return p;
      });
      var i = 0, ok = 0;
      function step() {
        if (i >= todo.length) { toast('导入完成，成功 ' + ok + ' 条'); loadData(); return; }
        var batch = todo.slice(i, i + 100); i += 100;
        // SDK 为单条写入接口，这里串行逐条提交
        var chain = Promise.resolve();
        batch.forEach(function (p) {
          chain = chain.then(function () {
            return db.addRecord({ databaseId: DATABASE_ID, properties: p })
              .then(function () { ok++; })['catch'](function () { });
          });
        });
        chain.then(step);
      }
      step();
    };
    fr.readAsText(file);
  }

  // ---------- 事件绑定 ----------
  function bindEvents() {
    $('kw').addEventListener('input', function () { state.kw = this.value; renderStream(); });
    $('fDir').addEventListener('change', function () { state.dir = this.value; renderStream(); });
    $('fLevel').addEventListener('change', function () { state.level = this.value; renderStream(); });
    $('fState').addEventListener('change', function () { state.st = this.value; renderStream(); });
    $('btnRefresh').addEventListener('click', function () { state.busy = false; loadData(); });
    $('btnExport').addEventListener('click', doExport);
    $('btnImport').addEventListener('click', function () { $('fileIn').click(); });
    $('fileIn').addEventListener('change', function () {
      if (this.files && this.files[0]) doImport(this.files[0]);
      this.value = '';
    });
  }

  // ---------- 初始化 ----------
  function subscribeUpdates() {
    if (!db || typeof db.onUpdated !== 'function') return;
    var timer = null;
    db.onUpdated(function (payload) {
      var ids = (payload && payload.databaseIds) || [];
      if (ids.indexOf(DATABASE_ID) === -1) return;
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { timer = null; loadData(); }, 400);
    });
  }

  function init() {
    bindEvents();
    renderFilterOptions();
    renderChips();
    if (!db) {
      state.offline = true;
      setSync('off', '离线模式（本地快照）');
      state.rows = applyPatch(lsGet(LS_SNAP) || []);
      refreshAll();
      return;
    }
    db.getSchema({ databaseId: DATABASE_ID }).then(function (schema) {
      (schema.properties || []).forEach(function (f) {
        if ((f.type === 'select' || f.type === 'multi_select') && f.config && f.config.options) {
          SCHEMA_OPTIONS[f.name] = f.config.options;
        }
      });
      renderFilterOptions();
    })['catch'](function () { renderFilterOptions(); });
    subscribeUpdates();
    loadData();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
</body>
</html>
